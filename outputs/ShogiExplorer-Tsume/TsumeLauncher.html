<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>诘将棋练习</title>
  <style>
    :root { color-scheme: light; --ink:#263238; --muted:#718096; --line:#d9e1e8; --paper:#f7f9fb; --card:#fff; --accent:#2f6f61; --accent-soft:#e6f2ed; --warn:#a56322; --danger:#b94a48; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font:14px/1.5 "Microsoft YaHei UI","Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif; }
    button, select { font:inherit; }
    button { cursor:pointer; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); padding:8px 12px; }
    button:hover { border-color:#99b8ad; background:#f5fbf8; }
    button.primary { border-color:var(--accent); background:var(--accent); color:#fff; }
    button.primary:hover { background:#285e52; }
    button.danger { color:var(--danger); }
    .app { min-height:100vh; }
    .topbar { height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 26px; background:#fff; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:12px; }
    .brand-mark { width:34px; height:34px; display:grid; place-items:center; border-radius:10px; color:#fff; background:var(--accent); font-size:21px; }
    .brand h1 { margin:0; font-size:19px; letter-spacing:.03em; }
    .brand p { margin:1px 0 0; color:var(--muted); font-size:12px; }
    .top-actions { display:flex; gap:8px; align-items:center; }
    .pill { border-radius:999px; padding:5px 11px; background:var(--accent-soft); color:var(--accent); font-size:12px; }
    .layout { display:grid; grid-template-columns:285px minmax(560px,1fr); gap:22px; max-width:1320px; margin:0 auto; padding:22px; }
    .sidebar { display:flex; flex-direction:column; gap:14px; }
    .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; box-shadow:0 3px 14px rgba(40,60,70,.04); }
    .panel h2 { margin:0 0 12px; font-size:15px; }
    .panel h3 { margin:16px 0 8px; font-size:13px; color:var(--muted); font-weight:600; }
    .lengths { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
    .lengths button { padding:7px 4px; }
    .lengths button.active { border-color:var(--accent); color:var(--accent); background:var(--accent-soft); font-weight:700; }
    .stack { display:flex; flex-direction:column; gap:8px; }
    .wide { width:100%; }
    #puzzleSelect { width:100%; min-height:148px; padding:6px; background:#fbfcfd; }
    .metric-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
    .metric { border:1px solid var(--line); border-radius:9px; padding:9px 10px; background:#fbfcfd; }
    .metric span { display:block; color:var(--muted); font-size:11px; }
    .metric strong { display:block; margin-top:2px; font-size:20px; font-weight:700; }
    .progress-row { margin-top:10px; }
    .progress-label { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; margin-bottom:4px; }
    progress { width:100%; height:8px; accent-color:var(--accent); }
    .achievements { display:flex; flex-direction:column; gap:6px; }
    .achievement { display:flex; gap:8px; align-items:flex-start; color:var(--muted); font-size:12px; }
    .achievement.earned { color:var(--ink); }
    .badge { width:20px; height:20px; flex:0 0 20px; display:grid; place-items:center; border-radius:50%; background:#eef1f3; color:#9aa5ad; font-size:12px; }
    .earned .badge { background:#f5dfaa; color:#8a5a12; }
    .workspace { min-width:0; }
    .problem-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin:2px 0 13px; }
    .problem-head h2 { margin:0; font-size:21px; }
    .problem-meta { display:flex; flex-wrap:wrap; gap:8px; color:var(--muted); font-size:12px; margin-top:3px; }
    .problem-actions { display:flex; gap:7px; flex-wrap:wrap; justify-content:flex-end; }
    .board-card { display:flex; justify-content:center; background:#f1e1bd; border:1px solid #c8a977; border-radius:12px; padding:18px; box-shadow:0 8px 25px rgba(110,80,34,.12); }
    #board { display:grid; grid-template-columns:repeat(9,minmax(47px,70px)); grid-template-rows:repeat(9,minmax(47px,70px)); border:2px solid #55432e; background:#d8b16b; }
    .cell { position:relative; display:grid; place-items:center; border-right:1px solid rgba(74,51,25,.68); border-bottom:1px solid rgba(74,51,25,.68); background:linear-gradient(135deg,#e1bc79,#d2a45e); user-select:none; }
    .cell:nth-child(9n) { border-right:0; }
    .cell:nth-last-child(-n+9) { border-bottom:0; }
    .cell:hover { background:#efd18f; }
    .cell.selected { background:#b8dfc5; box-shadow:inset 0 0 0 3px #438a6c; }
    .cell.hint { background:#f7d681; box-shadow:inset 0 0 0 3px #b8782f; }
    .cell.wrong { animation:shake .23s linear 0s 2; background:#efb4ae; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 50%{transform:translateX(3px)} }
    .coord { position:absolute; top:2px; right:3px; color:rgba(75,49,19,.48); font-size:9px; }
    .piece { display:block; font-family:"Yu Mincho","MS Mincho",serif; font-size:clamp(25px,3.2vw,39px); line-height:1; color:#30281e; text-shadow:0 1px #f5dfb4; transform:translateY(1px); }
    .piece.gote { transform:rotate(180deg) translateY(1px); color:#443126; }
    .piece.promoted { color:#a8432f; }
    .hands { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:13px; }
    .hand-card { min-height:54px; background:#fff; border:1px solid var(--line); border-radius:9px; padding:8px 11px; }
    .hand-title { color:var(--muted); font-size:12px; margin-bottom:5px; }
    .hand-pieces { display:flex; flex-wrap:wrap; gap:5px; }
    .hand-piece { min-width:33px; padding:4px 5px; border-radius:6px; font-family:"Yu Mincho","MS Mincho",serif; font-size:18px; }
    .hand-piece.active { color:var(--accent); border-color:var(--accent); background:var(--accent-soft); }
    .count { font:11px/1 Arial,sans-serif; margin-left:2px; color:var(--muted); }
    .actionbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:13px; }
    .actionbar .spacer { flex:1; }
    .feedback { min-height:48px; margin-top:13px; border:1px solid var(--line); border-radius:9px; padding:10px 12px; background:#fff; color:#4f5f68; }
    .feedback.good { border-color:#a7d1bf; background:#f0faf5; color:#25664d; }
    .feedback.bad { border-color:#e8b7b2; background:#fff5f4; color:#9f403d; }
    .feedback strong { font-weight:700; }
    .answer { margin-top:8px; color:var(--muted); font-size:12px; word-break:break-all; }
    .note { margin:10px 1px 0; color:var(--muted); font-size:11px; }
    .modal { position:fixed; inset:0; display:none; place-items:center; background:rgba(27,38,43,.35); z-index:4; }
    .modal.show { display:grid; }
    .modal-card { width:min(360px,calc(100vw - 32px)); background:#fff; border-radius:12px; padding:19px; box-shadow:0 18px 48px rgba(0,0,0,.2); }
    .modal-card h3 { margin:0 0 13px; }
    .modal-actions { display:flex; gap:9px; }
    @media (max-width:900px) { .layout { grid-template-columns:1fr; } .sidebar { order:2; } .workspace { order:1; } .topbar { padding:0 15px; } .layout { padding:15px; } }
    @media (max-width:600px) { .top-actions .pill { display:none; } .problem-head { flex-direction:column; } .problem-actions { justify-content:flex-start; } .board-card { padding:8px; } #board { grid-template-columns:repeat(9, minmax(31px,1fr)); grid-template-rows:repeat(9,minmax(31px,1fr)); width:100%; } .hands { gap:7px; } }

    /* 桌面版视觉整理：保留轻量单文件结构，强化棋盘、训练反馈和成就感。 */
    :root { --ink:#1b2a33; --muted:#74828a; --line:#d8e1df; --paper:#edf3f1; --card:rgba(255,255,255,.92); --accent:#1f7565; --accent-soft:#e1f1eb; --warn:#a86d2c; --danger:#b84f4b; }
    body { min-height:100vh; background:radial-gradient(circle at 8% 4%,rgba(214,235,225,.9),transparent 31%),radial-gradient(circle at 93% 18%,rgba(250,231,193,.68),transparent 30%),linear-gradient(135deg,#f4f7f5 0%,#eaf1ef 100%); }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.22; background-image:linear-gradient(115deg,rgba(255,255,255,.5) 1px,transparent 1px),linear-gradient(25deg,rgba(40,83,70,.035) 1px,transparent 1px); background-size:42px 42px,58px 58px; }
    .app { position:relative; z-index:1; }
    .topbar { height:76px; padding:0 max(22px,calc((100vw - 1400px)/2 + 22px)); background:rgba(255,255,255,.84); border-bottom:1px solid rgba(191,210,204,.72); box-shadow:0 8px 28px rgba(45,76,68,.08); backdrop-filter:blur(14px); }
    .brand { gap:13px; }
    .brand-mark { width:42px; height:42px; border-radius:14px; background:linear-gradient(145deg,#c58a4e,#80562f); box-shadow:0 7px 15px rgba(113,72,31,.22),inset 0 1px rgba(255,255,255,.45); font-size:23px; font-weight:800; }
    .brand h1 { font-size:21px; font-weight:800; color:#182a31; }
    .brand p { color:#71817e; letter-spacing:.08em; }
    .top-actions { gap:11px; }
    .top-actions > #timer { min-width:57px; color:#5f716e; font-size:13px; font-variant-numeric:tabular-nums; text-align:right; }
    .pill { padding:6px 12px; background:var(--accent-soft); border:1px solid #c8e3d8; color:#226957; font-weight:700; }
    button { border-color:#d2dfdc; border-radius:10px; padding:9px 13px; font-weight:600; box-shadow:0 2px 0 rgba(25,55,48,.04); transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease,background .15s ease; }
    button:hover { border-color:#8fbdae; background:#f4fcf8; box-shadow:0 5px 12px rgba(31,91,76,.09); transform:translateY(-1px); }
    button:active { transform:translateY(0); box-shadow:0 1px 2px rgba(25,55,48,.06); }
    button.primary { border-color:#1d6d5e; background:linear-gradient(135deg,#267c6b,#1c6658); box-shadow:0 6px 14px rgba(31,111,94,.2); }
    button.primary:hover { background:linear-gradient(135deg,#2b8876,#1d6b5b); }
    .layout { grid-template-columns:318px minmax(560px,1fr); gap:24px; max-width:1400px; padding:28px 24px 36px; }
    .sidebar { gap:16px; }
    .panel { border:1px solid rgba(203,219,214,.9); border-radius:18px; padding:18px; background:var(--card); box-shadow:0 14px 34px rgba(44,76,67,.08); }
    .panel h2 { margin-bottom:14px; color:#203a3b; font-size:16px; letter-spacing:.02em; }
    .panel h3 { margin-top:19px; color:#82908e; letter-spacing:.08em; }
    .lengths { gap:8px; }
    .lengths button { min-height:43px; font-size:15px; }
    .lengths button.active { background:linear-gradient(145deg,#e7f5ef,#d9eee6); box-shadow:inset 0 0 0 1px rgba(31,117,101,.11); }
    #puzzleSelect { min-height:172px; border:1px solid #d5e1de; border-radius:11px; outline:none; color:#2d4547; background:linear-gradient(180deg,#fcfefd,#f4f8f7); }
    #puzzleSelect:focus { border-color:#75ad9d; box-shadow:0 0 0 3px rgba(67,143,123,.13); }
    .metric-grid { gap:9px; }
    .metric { border:1px solid #dce7e3; border-radius:12px; padding:11px 12px; background:linear-gradient(145deg,rgba(251,254,253,.98),rgba(240,247,244,.9)); }
    .metric span { color:#84928f; letter-spacing:.02em; }
    .metric strong { color:#1f6457; font-size:21px; }
    .progress-row { padding:11px 12px 2px; border-radius:12px; background:#f1f8f5; }
    .progress-label { color:#6d807b; }
    .achievements { gap:7px; }
    .achievement { min-height:35px; padding:7px 8px; border:1px solid #e3eae8; border-radius:10px; background:#f7faf9; }
    .achievement.earned { border-color:#e5d09d; background:linear-gradient(135deg,#fffaf0,#fff5db); color:#594b2d; }
    .badge { background:#e9efed; }
    .earned .badge { background:#e7bf69; color:#704c16; box-shadow:0 2px 5px rgba(135,91,24,.14); }
    .workspace { min-width:0; }
    .problem-head { margin:0 0 16px; padding:17px 19px; border:1px solid rgba(203,219,214,.92); border-radius:18px; background:rgba(255,255,255,.8); box-shadow:0 10px 24px rgba(44,76,67,.055); }
    .problem-head h2 { color:#1b393b; font-size:23px; }
    .problem-meta { margin-top:5px; }
    .problem-actions { gap:8px; }
    .board-card { min-height:calc(min(100%, 670px)); padding:22px; border:1px solid #c7a369; border-radius:22px; background:radial-gradient(circle at 35% 18%,#f4d89f 0,#e9c27f 38%,#d3a35c 100%); box-shadow:0 18px 38px rgba(108,76,36,.17),inset 0 1px rgba(255,255,255,.5); }
    #board { width:min(100%,630px); aspect-ratio:1; grid-template-columns:repeat(9,1fr); grid-template-rows:repeat(9,1fr); border:3px solid #574126; border-radius:2px; box-shadow:0 9px 17px rgba(78,48,17,.2),inset 0 0 0 1px rgba(255,233,184,.36); }
    .cell { background:linear-gradient(135deg,#e9c681,#d2a35c); }
    .cell:hover { background:#f2d493; }
    .cell.selected { background:#b8dfc5; box-shadow:inset 0 0 0 3px #3b8567,0 0 0 2px rgba(255,255,255,.22); }
    .cell.hint { background:#f7d681; box-shadow:inset 0 0 0 3px #b8782f,0 0 0 2px rgba(255,255,255,.2); }
    .piece { text-shadow:0 1px #f7e7c4,0 2px 3px rgba(63,39,16,.16); }
    .hands { gap:14px; margin-top:15px; }
    .hand-card { min-height:60px; border:1px solid #d5e2de; border-radius:13px; padding:10px 12px; background:rgba(255,255,255,.83); box-shadow:0 5px 14px rgba(44,76,67,.05); }
    .hand-title { color:#758784; font-weight:600; }
    .hand-piece { border-color:#d8e4e0; background:#fbfdfc; }
    .hand-piece.active { box-shadow:0 4px 10px rgba(31,117,101,.13); }
    .actionbar { margin-top:15px; }
    .feedback { min-height:52px; margin-top:15px; border-radius:13px; padding:12px 14px; background:rgba(255,255,255,.84); box-shadow:0 6px 16px rgba(44,76,67,.045); }
    .feedback.good { background:linear-gradient(135deg,#f1fbf6,#e7f7ee); }
    .feedback.bad { background:linear-gradient(135deg,#fff7f5,#fff0ed); }
    .answer { margin:9px 2px 0; padding:0 4px; }
    .note { color:#81918d; }
    .modal { background:rgba(25,44,43,.42); backdrop-filter:blur(3px); }
    .modal-card { border:1px solid #d4e2dd; border-radius:17px; padding:21px; box-shadow:0 22px 60px rgba(26,53,47,.24); }
    @media (max-width:900px) { .layout { grid-template-columns:1fr; gap:16px; padding:20px 16px 28px; } .sidebar { order:2; } .workspace { order:1; } .panel,.problem-head { border-radius:15px; } .board-card { border-radius:18px; } }
    @media (max-width:600px) { .topbar { height:68px; } .brand h1 { font-size:18px; } .brand-mark { width:37px; height:37px; border-radius:12px; font-size:20px; } .layout { padding:14px 11px 24px; } .problem-head { padding:15px; } .problem-head h2 { font-size:20px; } .board-card { padding:9px; } #board { width:100%; } .hands { gap:8px; } .hand-card { padding:8px; } .actionbar { gap:6px; } }
    .bank-tabs { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-bottom:9px; }
    .bank-tabs button { padding:7px 4px; }
    .bank-tabs button.active { color:var(--accent); border-color:var(--accent); background:var(--accent-soft); font-weight:800; }
    .setting-row { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:9px; min-height:34px; color:#405957; }
    .setting-row + .setting-row { border-top:1px solid #edf1ef; }
    .setting-row input { width:16px; height:16px; accent-color:var(--accent); }
    .setting-row span { font-weight:650; }
    .setting-row small { color:#879691; font-size:11px; text-align:right; }
    .setting-row select { min-width:120px; border:1px solid #d7e3df; border-radius:8px; padding:5px 7px; color:#405957; background:#fbfefd; }
    .engine-status-ok { color:#23735b !important; }
    .engine-status-off { color:#ad6b31 !important; }
    #enginePill { transition:color .2s ease,background .2s ease,border-color .2s ease; }
    #enginePill.engine-status-off { background:#fff3e4; border-color:#ecd1ad; color:#98612c; }
    #enginePill.engine-status-ok { background:#e5f4ec; border-color:#c5e1d3; color:#23735b; }
    #enginePill.engine-status-thinking { background:#fff4d9; border-color:#ecd49d; color:#966822; }
    .feedback.pending { border-color:#ecd49d; background:#fffaf0; color:#8b682d; }
    .feedback.fail { border-color:#e4a7a1; background:#fff1ef; color:#a33f3b; }
    .problem-meta span + span { padding-left:8px; border-left:1px solid #d9e4e0; }
   @media (max-width:600px) { .top-actions { gap:5px; } #enginePill { display:none; } .setting-row { grid-template-columns:auto 1fr; } .setting-row small { grid-column:2; text-align:left; margin-top:-5px; } .setting-row select { grid-column:2; width:100%; } }

    /* 第二轮视觉：现代棋类应用风格，保持离线单文件和中文字体回退。 */
    :root { --ink:#1b2934; --muted:#73828d; --line:#d3e0e6; --paper:#f3f7f9; --card:rgba(255,255,255,.94); --accent:#2f719a; --accent-soft:#e5f1f7; --warn:#ad7734; --danger:#b65450; color-scheme:light; }
    html, body { font-family:'Segoe UI','Microsoft YaHei UI','Microsoft YaHei','Noto Sans CJK SC',sans-serif; font-synthesis:none; -webkit-font-smoothing:antialiased; }
    body { color:var(--ink); background:radial-gradient(circle at 8% 2%,rgba(211,234,245,.88),transparent 30%),radial-gradient(circle at 95% 16%,rgba(247,230,196,.7),transparent 31%),linear-gradient(135deg,#f6f9fb 0%,#edf3f6 100%); }
    body::before { opacity:.12; background-image:linear-gradient(115deg,rgba(255,255,255,.8) 1px,transparent 1px),linear-gradient(25deg,rgba(43,90,112,.06) 1px,transparent 1px); background-size:42px 42px,58px 58px; }
    .topbar { background:rgba(250,253,255,.84); border-bottom-color:rgba(190,211,222,.8); box-shadow:0 8px 28px rgba(43,80,101,.09); }
    .brand-mark { background:linear-gradient(145deg,#4a91bb,#245d86); box-shadow:0 7px 15px rgba(35,86,119,.22),inset 0 1px rgba(255,255,255,.5); }

    .brand p { color:#708491; }
    button, select { font-family:inherit; }
    button { border-color:#cfdee5; color:#2b4250; }
    button:hover { border-color:#86b3c8; background:#f3faff; box-shadow:0 5px 12px rgba(42,101,133,.11); }
    button.primary { border-color:#2b6b92; background:linear-gradient(135deg,#3b83aa,#286486); box-shadow:0 6px 14px rgba(42,105,139,.22); }

    .pill { background:var(--accent-soft); border-color:#c7e0eb; color:#286581; }

    .panel, .problem-head { border-color:rgba(201,219,228,.95); box-shadow:0 14px 34px rgba(45,81,99,.08); }
    .panel h2, .problem-head h2 { color:#1d3d50; }
    .lengths button.active, .bank-tabs button.active { color:#286988; border-color:#72a9c2; background:linear-gradient(145deg,#eaf6fb,#dceef6); }

    .achievement.earned { border-color:#e6cf9b; background:linear-gradient(135deg,#fffaf0,#fff4d8); }
